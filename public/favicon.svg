<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background gradient -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0118;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#1a0b2e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0f0520;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="textGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ec4899;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#a855f7;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f97316;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="8" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="512" height="512" fill="url(#bgGradient)" rx="80"/>
  
  <!-- Glow circle -->
  <circle cx="256" cy="256" r="200" fill="none" stroke="url(#textGradient)" stroke-width="2" opacity="0.3"/>
  
  <!-- F Letter -->
  <path d="M 140 160 L 280 160 L 280 200 L 200 200 L 200 240 L 260 240 L 260 280 L 200 280 L 200 360 L 140 360 Z" 
        fill="url(#textGradient)" filter="url(#glow)"/>
  
  <!-- D Letter -->
  <path d="M 300 160 L 360 160 Q 420 160 420 220 L 420 300 Q 420 360 360 360 L 300 360 Z M 340 200 L 340 320 L 360 320 Q 380 320 380 300 L 380 220 Q 380 200 360 200 Z" 
        fill="url(#textGradient)" filter="url(#glow)"/>
  
  <!-- Sparkles -->
  <circle cx="120" cy="140" r="4" fill="#ffffff" opacity="0.8"/>
  <circle cx="390" cy="150" r="3" fill="#ffffff" opacity="0.6"/>
  <circle cx="430" cy="380" r="4" fill="#ffffff" opacity="0.8"/>
  <circle cx="100" cy="380" r="3" fill="#ffffff" opacity="0.6"/>
</svg>
